<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miércoles de Cintas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #121212;
    --panel2: #171717;
    --cream: #e8e2d0;
    --cream-dim: #b5ae9a;
    --cream-faint: rgba(232, 226, 208, 0.14);
    --gold: #c9a35c;
    --red: #8f3b3b;
    --green: #5c8a5c;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-color: #333 #0b0b0b; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: var(--sans);
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 50% -10%, rgba(232,226,208,0.045), transparent 55%);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Header compacto sticky ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(11,11,11,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--cream-faint);
  }
  .topbar-in {
    max-width: 980px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; gap: 14px; height: 58px;
  }
  .logo-mini {
    width: 36px; height: 36px; flex: none;
    border: 1px solid var(--cream-faint); background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logo-mini img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .logo-fallback { font-family: var(--serif); font-style: italic; font-weight: 900; font-size: 15px; }
  .brand {
    font-family: var(--serif); font-weight: 900; font-size: 17px;
    letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap;
  }
  .brand .amp { color: var(--gold); }
  .members {
    color: var(--cream-dim); font-size: 10px; letter-spacing: 0.28em;
    text-transform: uppercase; white-space: nowrap; margin-left: 4px;
  }
  .identity { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--cream-dim); white-space: nowrap; }
  .identity b { color: var(--cream); font-weight: 600; }
  .identity button {
    background: none; border: 1px solid var(--cream-faint); color: var(--cream-dim);
    font-size: 10px; padding: 4px 9px; cursor: pointer; letter-spacing: 0.08em;
    text-transform: uppercase; font-family: var(--sans); transition: all .15s;
  }
  .identity button:hover { color: var(--cream); border-color: var(--cream-dim); }

  .wrap { max-width: 980px; margin: 0 auto; padding: 36px 20px 80px; }

  /* ---------- Secciones ---------- */
  section { margin-bottom: 56px; }
  h2 {
    font-family: var(--serif); font-size: 19px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px;
  }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--cream-faint); align-self: center; }
  h2 .count { font-family: var(--sans); font-size: 11px; color: var(--cream-dim); font-weight: 400; letter-spacing: 0; }

  /* ---------- Ya vistas ---------- */
  .watched-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .watched-card {
    border: 1px solid var(--cream-faint); background: var(--panel);
    display: flex; flex-direction: column; overflow: hidden;
    animation: rise .35s ease both;
    transition: border-color .2s, transform .2s;
  }
  .watched-card:hover { border-color: rgba(232,226,208,0.35); transform: translateY(-2px); }
  .poster {
    aspect-ratio: 2/3; background: #000 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    filter: grayscale(1) contrast(1.05); position: relative;
    transition: filter .25s;
  }
  .watched-card:hover .poster { filter: grayscale(0.4) contrast(1.05); }
  .poster .ep {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--cream-dim); background: rgba(0,0,0,0.78); padding: 2px 8px;
  }
  .poster .noposter { font-family: var(--serif); font-size: 40px; font-weight: 900; color: rgba(232,226,208,0.15); }
  .watched-card .info { padding: 11px 12px 13px; border-top: 1px solid rgba(232,226,208,0.07); }
  .watched-card .title { font-family: var(--serif); font-weight: 700; font-size: 15px; line-height: 1.25; }
  .watched-card .dir { color: var(--cream-dim); font-size: 11px; margin-top: 3px; min-height: 13px; }
  .watched-card .year { color: rgba(181,174,154,0.65); font-size: 10.5px; margin-top: 1px; letter-spacing: 0.06em; }

  /* ---------- Ratings ---------- */
  .ratings { display: flex; gap: 10px; margin-top: 7px; font-size: 11px; color: var(--cream-dim); min-height: 14px; flex-wrap: wrap; }
  .ratings span { display: inline-flex; align-items: center; gap: 4px; }
  .ratings .val { color: var(--cream); font-weight: 600; }

  /* ---------- Buscador ---------- */
  .search-form { display: flex; gap: 10px; margin-bottom: 18px; }
  .search-form input {
    flex: 1; background: var(--panel); border: 1px solid var(--cream-faint); color: var(--cream);
    padding: 13px 16px; font-family: var(--sans); font-size: 14px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .search-form input:focus { border-color: var(--cream-dim); background: var(--panel2); }
  .search-form input::placeholder { color: rgba(181,174,154,0.5); }
  .btn-solid {
    background: var(--cream); color: #0b0b0b; border: 1px solid var(--cream); padding: 12px 26px;
    font-family: var(--sans); font-weight: 600; font-size: 12px; cursor: pointer;
    letter-spacing: 0.12em; text-transform: uppercase; transition: opacity .15s;
  }
  .btn-solid:hover { opacity: 0.85; }
  .btn-ghost {
    background: none; border: 1px solid var(--cream-faint); color: var(--cream-dim);
    padding: 12px 20px; font-family: var(--sans); font-size: 12px; cursor: pointer;
    letter-spacing: 0.1em; text-transform: uppercase; transition: all .15s;
  }
  .btn-ghost:hover { color: var(--cream); border-color: var(--cream-dim); }

  .search-hint { color: rgba(181,174,154,0.55); font-size: 11.5px; margin: -8px 0 18px; letter-spacing: 0.03em; }

  /* resultados */
  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 12px; margin-bottom: 26px;
  }
  .res-card {
    border: 1px solid var(--cream-faint); background: var(--panel); cursor: pointer;
    overflow: hidden; animation: rise .3s ease both;
    transition: border-color .15s, transform .15s;
  }
  .res-card:nth-child(2) { animation-delay: .03s; } .res-card:nth-child(3) { animation-delay: .06s; }
  .res-card:nth-child(4) { animation-delay: .09s; } .res-card:nth-child(5) { animation-delay: .12s; }
  .res-card:hover { border-color: var(--gold); transform: translateY(-3px); }
  .res-poster {
    aspect-ratio: 2/3; background: #000 center/cover no-repeat;
    filter: grayscale(1); transition: filter .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .res-card:hover .res-poster { filter: grayscale(0); }
  .res-poster .ph { font-family: var(--serif); font-size: 30px; font-weight: 900; color: rgba(232,226,208,0.14); }
  .res-info { padding: 8px 9px 10px; border-top: 1px solid rgba(232,226,208,0.07); }
  .res-t { font-size: 12px; font-weight: 500; line-height: 1.3; }
  .res-y { font-size: 10.5px; color: var(--cream-dim); margin-top: 2px; }

  .no-res {
    border: 1px dashed var(--cream-faint); padding: 22px; text-align: center;
    color: var(--cream-dim); font-size: 13px; margin-bottom: 26px;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .no-res .btn-ghost { padding: 9px 16px; font-size: 11px; }

  /* panel de confirmación */
  .picked {
    border: 1px solid var(--gold); background: var(--panel);
    padding: 18px; margin-bottom: 26px; animation: rise .3s ease both;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .picked-poster {
    width: 84px; aspect-ratio: 2/3; flex: none;
    background: #000 center/cover no-repeat; filter: grayscale(1);
    border: 1px solid var(--cream-faint);
    display: flex; align-items: center; justify-content: center;
  }
  .picked-poster .ph { font-family: var(--serif); font-size: 26px; font-weight: 900; color: rgba(232,226,208,0.14); }
  .picked-main { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
  .picked-title { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }
  .picked-title .y { color: var(--gold); font-size: 15px; font-weight: 500; font-style: italic; margin-left: 6px; }
  .picked-sub { color: var(--cream-dim); font-size: 12px; min-height: 15px; }
  .picked-main input {
    background: var(--panel2); border: 1px solid var(--cream-faint); color: var(--cream);
    padding: 11px 13px; font-family: var(--sans); font-size: 13px; outline: none; width: 100%;
    transition: border-color .15s;
  }
  .picked-main input:focus { border-color: var(--cream-dim); }
  .picked-main input::placeholder { color: rgba(181,174,154,0.5); }
  .picked-actions { display: flex; gap: 10px; margin-top: 2px; }

  /* ---------- Cards de recomendación ---------- */
  .rec {
    border: 1px solid var(--cream-faint); background: var(--panel);
    padding: 16px; margin-bottom: 12px; position: relative;
    display: flex; gap: 16px; animation: rise .35s ease both;
    transition: border-color .2s;
  }
  .rec:hover { border-color: rgba(232,226,208,0.3); }
  .rec.next-pick { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,163,92,0.05), transparent 45%), var(--panel); }
  .next-badge {
    position: absolute; top: -9px; left: 14px;
    background: var(--gold); color: #0b0b0b; font-size: 10px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; padding: 2px 10px;
  }
  .rec-poster {
    width: 64px; aspect-ratio: 2/3; flex: none; align-self: flex-start;
    background: #000 center/cover no-repeat; filter: grayscale(1);
    border: 1px solid rgba(232,226,208,0.1);
    display: flex; align-items: center; justify-content: center;
    transition: filter .2s;
  }
  .rec:hover .rec-poster { filter: grayscale(0.35); }
  .rec-poster .ph { font-family: var(--serif); font-size: 22px; font-weight: 900; color: rgba(232,226,208,0.14); }
  .rec-main { flex: 1; min-width: 0; }
  .rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .rec-title { font-family: var(--serif); font-size: 19px; font-weight: 700; line-height: 1.2; }
  .rec-meta { font-size: 12px; color: var(--cream-dim); margin-top: 4px; }
  .rec-meta b { color: var(--cream); font-weight: 500; }
  .rec-comment { font-size: 13px; color: var(--cream-dim); font-style: italic; margin-top: 7px; line-height: 1.5; }
  .score {
    font-family: var(--serif); font-size: 28px; font-weight: 900; min-width: 50px;
    text-align: center; line-height: 1; flex: none;
  }
  .score.pos { color: var(--cream); } .score.neg { color: var(--red); } .score.zero { color: rgba(181,174,154,0.5); }
  .score small { display: block; font-family: var(--sans); font-size: 9px; font-weight: 400; color: var(--cream-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }

  .rec-actions { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; align-items: center; }
  .vote-btn {
    background: none; border: 1px solid var(--cream-faint); color: var(--cream-dim);
    padding: 7px 15px; cursor: pointer; font-family: var(--sans); font-size: 12px;
    font-weight: 600; transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .vote-btn:hover { border-color: var(--cream-dim); color: var(--cream); }
  .vote-btn.active-up { background: var(--green); border-color: var(--green); color: #0b0b0b; }
  .vote-btn.active-down { background: var(--red); border-color: var(--red); color: var(--cream); }
  .vote-btn.active-seen { background: var(--cream); border-color: var(--cream); color: #0b0b0b; }
  .del-btn {
    margin-left: auto; background: none; border: 1px solid var(--cream-faint);
    color: var(--cream-dim); padding: 7px 12px; cursor: pointer; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; transition: all .15s;
  }
  .del-btn:hover { border-color: var(--red); color: var(--red); }

  .voters { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .chip {
    font-size: 10px; padding: 3px 9px; border: 1px solid var(--cream-faint);
    color: var(--cream-dim); letter-spacing: 0.05em; display: inline-flex; gap: 5px; align-items: center;
  }
  .chip.up { border-color: rgba(92,138,92,0.5); }
  .chip.down { border-color: rgba(143,59,59,0.6); }
  .chip .sym { font-weight: 700; }
  .chip.up .sym { color: var(--green); } .chip.down .sym { color: var(--red); }

  .empty {
    text-align: center; color: var(--cream-dim); font-family: var(--serif);
    font-style: italic; font-size: 16px; padding: 40px 24px;
    border: 1px dashed var(--cream-faint); line-height: 1.6;
  }
  .empty .sub { font-family: var(--sans); font-style: normal; font-size: 11.5px; color: rgba(181,174,154,0.6); display: block; margin-top: 6px; }

  /* ---------- Footer ---------- */
  footer {
    text-align: center; color: rgba(181,174,154,0.45); font-size: 10.5px;
    letter-spacing: 0.15em; text-transform: uppercase; display: flex;
    justify-content: center; gap: 16px; align-items: center;
  }
  footer button {
    background: none; border: 1px solid var(--cream-faint); color: var(--cream-dim);
    padding: 4px 12px; cursor: pointer; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  footer button:hover { color: var(--cream); }
  .mode-warn { color: var(--gold); }

  /* ---------- Modal identidad ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 50;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px);
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--cream-faint);
    padding: 44px 48px; text-align: center; max-width: 90vw; animation: rise .3s ease both;
  }
  .modal h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .modal p { color: var(--cream-dim); font-size: 13px; margin-bottom: 28px; }
  .modal .people { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .people button {
    background: none; border: 1px solid var(--cream-faint); color: var(--cream);
    font-family: var(--serif); font-size: 19px; font-weight: 700; padding: 18px 30px;
    cursor: pointer; transition: all .15s;
  }
  .modal .people button:hover { background: var(--cream); color: #0b0b0b; }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .members { display: none; }
    .brand { font-size: 14px; letter-spacing: 0.1em; }
    .modal .people { grid-template-columns: 1fr; }
    .rec { flex-direction: row; }
    .rec-head { flex-direction: column-reverse; }
    .score { text-align: left; }
    .results-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  }
</style>
</head>
<body>

<div class="modal-overlay hidden" id="identityModal">
  <div class="modal">
    <h3>¿Quién sos?</h3>
    <p>Tu voto queda registrado a tu nombre.</p>
    <div class="people" id="peopleButtons"></div>
  </div>
</div>

<div class="topbar">
  <div class="topbar-in">
    <div class="logo-mini">
      <img src="logo.png" alt="" onerror="this.remove(); document.querySelector('.logo-mini').insertAdjacentHTML('beforeend','<span class=logo-fallback>MC</span>')">
    </div>
    <div class="brand">Miércoles <span class="amp">de</span> Cintas</div>
    <div class="members" id="membersLine"></div>
    <div class="identity">
      <span>Sos <b id="whoami">—</b></span>
      <button onclick="openIdentity()">cambiar</button>
    </div>
  </div>
</div>

<div class="wrap">
  <section>
    <h2>Ya vistas <span class="count" id="watchedCount"></span></h2>
    <div class="watched-grid" id="watchedGrid"></div>
  </section>

  <section>
    <h2>Recomendaciones <span class="count" id="recCount"></span></h2>

    <form class="search-form" id="searchForm" autocomplete="off">
      <input id="q" placeholder="Buscá por título o keyword — ej: godfather, casino, heat…" maxlength="120">
      <button type="submit" class="btn-solid">Buscar</button>
    </form>
    <div class="search-hint">Elegí de los resultados para proponer con ficha completa (director, ratings, póster).</div>

    <div class="results-grid hidden" id="resultsGrid"></div>

    <div class="no-res hidden" id="noRes">
      <span>OMDb no encontró nada para “<b id="noResQ"></b>”.</span>
      <button class="btn-ghost" onclick="pickFreeText()">Proponerla igual, a mano</button>
    </div>

    <div class="picked hidden" id="picked">
      <div class="picked-poster" id="pickedPoster"><span class="ph">?</span></div>
      <form class="picked-main" id="pickedForm">
        <div class="picked-title" id="pickedTitle"></div>
        <div class="picked-sub" id="pickedSub"></div>
        <input id="comment" placeholder="Por qué la banco (opcional)" maxlength="200">
        <div class="picked-actions">
          <button type="submit" class="btn-solid">Proponer</button>
          <button type="button" class="btn-ghost" onclick="cancelPick()">✕ Cancelar</button>
        </div>
      </form>
    </div>

    <div id="recList"></div>
  </section>

  <footer>
    <span id="modeLabel"></span>
    <button onclick="refresh(true)">↻ Actualizar</button>
  </footer>
</div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  // Supabase (backend compartido). Vacío => modo local (solo tu navegador).
  SUPABASE_URL: "https://sdnhxripjpjaevafiguk.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbmh4cmlwanBqYWV2YWZpZ3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjYyMDEsImV4cCI6MjEwMjI0MjIwMX0.0Tw4PUaoQ7jbmEhMY-W1gSWPjaqzBww1ECghAQbdsOQ",

  // OMDb (ratings IMDb + Rotten Tomatoes). Key gratis en https://www.omdbapi.com/apikey.aspx
  OMDB_API_KEY: "9e0533ad",

  FRIENDS: ["Marcos", "Tomi", "Juan", "Guido"],

  // Películas ya vistas. `search` es el título para buscar en OMDb (en inglés funciona mejor).
  WATCHED: [
    { title: "Obsession",      search: "Obsession" },
    { title: "Disclosure Day", search: "Disclosure Day" },
    { title: "El Padrino",     search: "The Godfather", y: 1972 },
  ],
};
/* ========================================== */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const useSupabase = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

let state = { recs: [], votes: [] };
let user = localStorage.getItem("mdc_user") || null;

/* ---------------- Stores ---------------- */
const localStore = {
  async load() {
    return {
      recs:  JSON.parse(localStorage.getItem("mdc_recs")  || "[]"),
      votes: JSON.parse(localStorage.getItem("mdc_votes") || "[]"),
    };
  },
  async addRec(rec) {
    const recs = JSON.parse(localStorage.getItem("mdc_recs") || "[]");
    recs.push(rec);
    localStorage.setItem("mdc_recs", JSON.stringify(recs));
  },
  async deleteRec(id) {
    const recs  = JSON.parse(localStorage.getItem("mdc_recs")  || "[]").filter(r => r.id !== id);
    const votes = JSON.parse(localStorage.getItem("mdc_votes") || "[]").filter(v => v.rec_id !== id);
    localStorage.setItem("mdc_recs", JSON.stringify(recs));
    localStorage.setItem("mdc_votes", JSON.stringify(votes));
  },
  async upsertVote(v) {
    const votes = JSON.parse(localStorage.getItem("mdc_votes") || "[]");
    const i = votes.findIndex(x => x.rec_id === v.rec_id && x.voter === v.voter);
    if (i >= 0) votes[i] = v; else votes.push(v);
    localStorage.setItem("mdc_votes", JSON.stringify(votes));
  },
};

const supaStore = {
  async _fetch(path, opts = {}) {
    const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
      ...opts,
      headers: {
        "apikey": CONFIG.SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        ...(opts.headers || {}),
      },
    });
    if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  },
  async load() {
    const [recs, votes] = await Promise.all([
      this._fetch("recs?select=*&order=created_at.asc"),
      this._fetch("votes?select=*"),
    ]);
    return { recs, votes };
  },
  async addRec(rec) {
    await this._fetch("recs", { method: "POST", body: JSON.stringify(rec) });
  },
  async deleteRec(id) {
    await this._fetch(`recs?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" });
  },
  async upsertVote(v) {
    await this._fetch("votes", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify(v),
    });
  },
};

const store = useSupabase ? supaStore : localStore;

/* ---------------- OMDb ---------------- */
// v2 del cache: agrega director
async function getRatings({ t, y, i }) {
  if (!CONFIG.OMDB_API_KEY) return null;
  const key = i ? "omdb2:i:" + i : "omdb2:" + t.toLowerCase() + (y ? ":" + y : "");
  const cached = localStorage.getItem(key);
  if (cached) return JSON.parse(cached);
  try {
    let url = `https://www.omdbapi.com/?apikey=${CONFIG.OMDB_API_KEY}&` +
      (i ? `i=${encodeURIComponent(i)}` : `t=${encodeURIComponent(t)}${y ? `&y=${y}` : ""}`);
    const d = await (await fetch(url)).json();
    let out = null;
    if (d.Response !== "False") {
      out = {
        imdb: d.imdbRating && d.imdbRating !== "N/A" ? d.imdbRating : null,
        rt: (d.Ratings || []).find(r => r.Source === "Rotten Tomatoes")?.Value || null,
        year: d.Year !== "N/A" ? d.Year : null,
        director: d.Director && d.Director !== "N/A" ? d.Director : null,
        poster: d.Poster && d.Poster !== "N/A" ? d.Poster : null,
      };
    }
    localStorage.setItem(key, JSON.stringify(out));
    return out;
  } catch { return null; }
}

function ratingsHtml(r) {
  if (!r || (!r.imdb && !r.rt)) return "";
  let h = "";
  if (r.imdb) h += `<span>★ IMDb <span class="val">${esc(r.imdb)}</span></span>`;
  if (r.rt)   h += `<span>🍅 <span class="val">${esc(r.rt)}</span></span>`;
  return h;
}

async function enrichRatings() {
  const nodes = document.querySelectorAll("[data-omdb]");
  await Promise.all([...nodes].map(async (el) => {
    const r = await getRatings(JSON.parse(el.dataset.omdb));
    if (!r) return;
    const rt = el.querySelector(".ratings");
    if (rt) rt.innerHTML = ratingsHtml(r);
    const yr = el.querySelector(".year");
    if (yr && r.year) yr.textContent = r.year;
    const dir = el.querySelector(".dir");
    if (dir && r.director) dir.textContent = r.director;
    const dirInline = el.querySelector(".dir-inline");
    if (dirInline && r.director) dirInline.textContent = `Dir. ${r.director} · `;
    const poster = el.querySelector(".poster");
    if (poster && r.poster) {
      poster.style.backgroundImage = `url("${r.poster}")`;
      poster.querySelector(".noposter")?.remove();
    }
    const rp = el.querySelector(".rec-poster");
    if (rp && r.poster) {
      rp.style.backgroundImage = `url("${r.poster}")`;
      rp.querySelector(".ph")?.remove();
    }
  }));
}

/* ---------------- Render ---------------- */
function renderWatched() {
  $("watchedCount").textContent = `(${CONFIG.WATCHED.length})`;
  $("watchedGrid").innerHTML = CONFIG.WATCHED.map((m, i) => `
    <div class="watched-card" style="animation-delay:${i * 0.05}s" data-omdb='${esc(JSON.stringify({ t: m.search || m.title, y: m.y }))}'>
      <div class="poster"><span class="ep">Nº ${i + 1}</span><span class="noposter">${esc(m.title[0])}</span></div>
      <div class="info">
        <div class="title">${esc(m.title)}</div>
        <div class="dir"></div>
        <div class="year">${m.y || ""}</div>
        <div class="ratings"></div>
      </div>
    </div>`).join("");
}

function voteOf(recId, voter) {
  return state.votes.find(v => v.rec_id === recId && v.voter === voter) || null;
}

function renderRecs() {
  const list = $("recList");
  $("recCount").textContent = `(${state.recs.length})`;
  if (!state.recs.length) {
    list.innerHTML = `<div class="empty">Todavía nadie propuso nada. Rompé el hielo.
      <span class="sub">Buscá arriba y elegí una película para el próximo miércoles.</span></div>`;
    return;
  }
  const scored = state.recs.map(r => {
    const votes = state.votes.filter(v => v.rec_id === r.id);
    return { ...r, _score: votes.reduce((a, v) => a + (v.vote || 0), 0), _votes: votes };
  }).sort((a, b) => b._score - a._score || a.created_at.localeCompare(b.created_at));

  const topScore = scored[0]._score;
  list.innerHTML = scored.map((r, idx) => {
    const mine = voteOf(r.id, user) || {};
    const isNext = idx === 0 && topScore > 0;
    const cls = r._score > 0 ? "pos" : r._score < 0 ? "neg" : "zero";
    const chips = r._votes
      .filter(v => v.vote || v.seen)
      .map(v => `<span class="chip ${v.vote > 0 ? "up" : v.vote < 0 ? "down" : ""}">
          ${v.vote ? `<span class="sym">${v.vote > 0 ? "+1" : "−1"}</span>` : ""}
          ${esc(v.voter)}${v.seen ? " 👁" : ""}</span>`).join("");
    return `
    <div class="rec ${isNext ? "next-pick" : ""}" style="animation-delay:${idx * 0.04}s" data-omdb='${esc(JSON.stringify(r.imdb_id ? { t: r.title, i: r.imdb_id } : { t: r.title }))}'>
      ${isNext ? `<span class="next-badge">Próxima cinta</span>` : ""}
      <div class="rec-poster"><span class="ph">${esc(r.title[0])}</span></div>
      <div class="rec-main">
        <div class="rec-head">
          <div>
            <div class="rec-title">${esc(r.title)}</div>
            <div class="rec-meta">${r.year ? esc(r.year) + " · " : ""}<span class="dir-inline"></span>propuesta de <b>${esc(r.author)}</b></div>
            ${r.comment ? `<div class="rec-comment">“${esc(r.comment)}”</div>` : ""}
            <div class="ratings"></div>
          </div>
          <div class="score ${cls}">${r._score > 0 ? "+" : ""}${r._score}<small>votos</small></div>
        </div>
        <div class="rec-actions">
          <button class="vote-btn ${mine.vote === 1 ? "active-up" : ""}" onclick="castVote('${r.id}', 1)">+1</button>
          <button class="vote-btn ${mine.vote === -1 ? "active-down" : ""}" onclick="castVote('${r.id}', -1)">−1</button>
          <button class="vote-btn ${mine.seen ? "active-seen" : ""}" onclick="toggleSeen('${r.id}')">👁 Ya la vi</button>
          ${r.author === user ? `<button class="del-btn" onclick="deleteRec('${r.id}')">✕ eliminar</button>` : ""}
        </div>
        ${chips ? `<div class="voters">${chips}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function render() {
  $("whoami").textContent = user || "—";
  $("membersLine").textContent = CONFIG.FRIENDS.join(" · ");
  $("modeLabel").innerHTML = useSupabase
    ? "modo compartido"
    : `<span class="mode-warn">modo local — configurá Supabase para compartir</span>`;
  renderWatched();
  renderRecs();
  enrichRatings();
}

/* ---------------- Actions ---------------- */
async function refresh(manual = false) {
  try {
    state = await store.load();
    render();
  } catch (e) {
    if (manual) alert("Error cargando datos: " + e.message);
    console.error(e);
  }
}

/* ---------------- Búsqueda ---------------- */
let picked = null;          // {Title, Year, imdbID, Poster} o {Title, freeText:true}
let sResults = [], sTimer = null, lastQuery = "";
const sCache = new Map();

async function doSearch(query) {
  const q = query.trim();
  if (q.length < 2) return;
  lastQuery = q;
  cancelPick(false);
  let results = sCache.get(q.toLowerCase());
  if (results === undefined) {
    try {
      // el "*" final hace prefix-match: "godfat*" → The Godfather
      const d = await (await fetch(`https://www.omdbapi.com/?apikey=${CONFIG.OMDB_API_KEY}&s=${encodeURIComponent(q + "*")}&type=movie`)).json();
      const seen = new Set();
      results = d.Response === "True"
        ? d.Search.filter(m => !seen.has(m.imdbID) && seen.add(m.imdbID))
        : [];
    } catch { results = []; }
    sCache.set(q.toLowerCase(), results);
  }
  if ($("q").value.trim() !== q) return;   // respuesta vieja
  sResults = results;
  renderResults();
}

function renderResults() {
  const grid = $("resultsGrid"), noRes = $("noRes");
  if (!sResults.length) {
    grid.classList.add("hidden");
    $("noResQ").textContent = lastQuery;
    noRes.classList.remove("hidden");
    return;
  }
  noRes.classList.add("hidden");
  grid.innerHTML = sResults.map((m, i) => `
    <div class="res-card" data-i="${i}">
      <div class="res-poster" ${m.Poster && m.Poster !== "N/A" ? `style="background-image:url('${esc(m.Poster)}')"` : ""}>
        ${m.Poster && m.Poster !== "N/A" ? "" : `<span class="ph">${esc(m.Title[0])}</span>`}
      </div>
      <div class="res-info">
        <div class="res-t">${esc(m.Title)}</div>
        <div class="res-y">${esc(m.Year)}</div>
      </div>
    </div>`).join("");
  grid.classList.remove("hidden");
}

function pick(m) {
  picked = m;
  $("resultsGrid").classList.add("hidden");
  $("noRes").classList.add("hidden");
  const pp = $("pickedPoster");
  pp.style.backgroundImage = m.Poster && m.Poster !== "N/A" ? `url("${m.Poster}")` : "";
  pp.innerHTML = m.Poster && m.Poster !== "N/A" ? "" : `<span class="ph">${esc(m.Title[0])}</span>`;
  $("pickedTitle").innerHTML = `${esc(m.Title)}${m.Year ? `<span class="y">${esc(m.Year)}</span>` : ""}`;
  $("pickedSub").textContent = m.freeText ? "Propuesta manual — sin ficha de OMDb" : "…";
  $("picked").classList.remove("hidden");
  $("comment").focus();
  if (m.imdbID) {
    getRatings({ t: m.Title, i: m.imdbID }).then(r => {
      if (!r || picked?.imdbID !== m.imdbID) return;
      const bits = [];
      if (r.director) bits.push(`Dir. ${r.director}`);
      if (r.imdb) bits.push(`★ IMDb ${r.imdb}`);
      if (r.rt) bits.push(`🍅 ${r.rt}`);
      $("pickedSub").textContent = bits.join("  ·  ") || "";
    });
  }
}

function pickFreeText() {
  pick({ Title: lastQuery, freeText: true });
}

function cancelPick(reshow = true) {
  picked = null;
  $("picked").classList.add("hidden");
  $("comment").value = "";
  if (reshow && sResults.length) $("resultsGrid").classList.remove("hidden");
}

$("resultsGrid").addEventListener("click", (e) => {
  const card = e.target.closest(".res-card");
  if (card) pick(sResults[+card.dataset.i]);
});

$("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  clearTimeout(sTimer);
  doSearch($("q").value);
});

$("q").addEventListener("input", () => {
  clearTimeout(sTimer);
  const q = $("q").value.trim();
  if (q.length < 3) return;
  sTimer = setTimeout(() => doSearch(q), 350);
});

/* ---------------- Proponer ---------------- */
$("pickedForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!user) return openIdentity();
  if (!picked) return;
  const title = picked.Title.trim();
  const comment = $("comment").value.trim();
  if (picked.imdbID && state.recs.some(x => x.imdb_id && x.imdb_id === picked.imdbID)) {
    alert("Esa ya está propuesta, gil.");
    return;
  }
  const all = [...state.recs.map(r => r.title), ...CONFIG.WATCHED.map(w => w.title)];
  if (all.some(t => t.toLowerCase() === title.toLowerCase())) {
    alert("Esa ya está en la lista, gil.");
    return;
  }
  const rec = {
    id: crypto.randomUUID(), title, comment: comment || null, author: user,
    created_at: new Date().toISOString(),
    imdb_id: picked.imdbID || null,
    year: picked.Year || null,
  };
  try {
    await store.addRec(rec);
    cancelPick(false);
    $("q").value = "";
    sResults = [];
    $("resultsGrid").classList.add("hidden");
    $("noRes").classList.add("hidden");
    await refresh();
  } catch (err) { alert("No se pudo guardar: " + err.message); }
});

async function castVote(recId, value) {
  if (!user) return openIdentity();
  const cur = voteOf(recId, user);
  const newVote = cur && cur.vote === value ? null : value;   // repetir = sacar el voto
  try {
    await store.upsertVote({ rec_id: recId, voter: user, vote: newVote, seen: cur?.seen || false });
    await refresh();
  } catch (err) { alert("No se pudo votar: " + err.message); }
}

async function toggleSeen(recId) {
  if (!user) return openIdentity();
  const cur = voteOf(recId, user);
  try {
    await store.upsertVote({ rec_id: recId, voter: user, vote: cur?.vote ?? null, seen: !(cur?.seen) });
    await refresh();
  } catch (err) { alert("No se pudo marcar: " + err.message); }
}

async function deleteRec(id) {
  if (!confirm("¿Eliminar tu recomendación?")) return;
  try {
    await store.deleteRec(id);
    await refresh();
  } catch (err) { alert("No se pudo eliminar: " + err.message); }
}

/* ---------------- Identity ---------------- */
function openIdentity() {
  $("peopleButtons").innerHTML = CONFIG.FRIENDS.map(f =>
    `<button onclick="setUser('${esc(f)}')">${esc(f)}</button>`).join("");
  $("identityModal").classList.remove("hidden");
}
function setUser(name) {
  user = name;
  localStorage.setItem("mdc_user", name);
  $("identityModal").classList.add("hidden");
  render();
}

/* ---------------- Init ---------------- */
render();
refresh();
if (!user) openIdentity();
if (useSupabase) {
  setInterval(() => refresh(), 25000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}
</script>
